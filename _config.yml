# Настройки публикации на GitHub Pages.
#
# Файлы и папки, которых не должно быть на сайте: служебные заметки и генераторы.
# Файлы с именами на подчёркивание (_articles.py, _generate.py) Jekyll пропускает сам,
# а README и промпты к обложкам без этого отдавались бы по прямой ссылке
# и могли попасть в поисковый индекс.
exclude:
  - README.md
  - pages
  - blog/covers/PROMPTS.md
  - .gitignore
